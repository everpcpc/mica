name: Release

on:
  push:
    branches: [main]
    paths: [mygo.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version mygo.json)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::release v$version already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Write the OAuth client configuration
        env:
          MICA_OAUTH_CLIENT_JSON: ${{ secrets.MICA_OAUTH_CLIENT_JSON }}
        run: |
          if [ -z "$MICA_OAUTH_CLIENT_JSON" ]; then
            echo "::error::MICA_OAUTH_CLIENT_JSON is required for this release build."
            exit 1
          fi
          mkdir -p internal/gmail
          umask 077
          printf '%s\n' "$MICA_OAUTH_CLIENT_JSON" > internal/gmail/oauth-client.json
          jq empty internal/gmail/oauth-client.json
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Configure macOS signing and notarization
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ] || \
             [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::warning::Apple credentials are incomplete; the release will be ad-hoc signed and not notarized."
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi
          jq --arg identity "$identity" --arg keychain "$keychain" \
            '.macos = (.macos // {}) + {signingIdentity: $identity, notarize: {keychainProfile: "notary", keychain: $keychain}}' \
            mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" mygo.json
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/universal
      - name: Package release artifacts
        run: |
          version="$(jq -r .version mygo.json)"
          mkdir -p build/release
          cp "build/darwin-universal/Mica $version.dmg" "build/release/Mica.$version.dmg"
          for file in build/darwin-universal/mica-*.tar.gz build/darwin-universal/mica-*.delta build/darwin-universal/update-*.json; do
            [ -e "$file" ] || continue
            cp "$file" build/release/
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mica-release
          path: build/release/*

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mica-release
          path: artifacts
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
