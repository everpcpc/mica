name: Copy KMServer Apple secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KMRS_SECRET_COPY_TOKEN }}
      APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Copy Apple secrets to kmrs
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              printf 'Missing source secret: %s\n' "$name" >&2
              exit 1
            fi
            printf '%s' "${!name}" | gh secret set "$name" --repo kmworks/kmrs
            printf 'Copied %s\n' "$name"
          done
